<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Shelf · Reusable Agent Skills</title>
  <meta name="description" content="Skill Shelf is a lightweight, agent-friendly registry of reusable SKILL.md files. Discover, browse and copy skills directly consumable by AI agents.">

  <meta property="og:title" content="Skill Shelf · Reusable Agent Skills">
  <meta property="og:description" content="A lightweight registry of reusable AI agent skills. Browse, copy, and drop them into any agent's workflow.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dghostninja.github.io/Skill-Shelf/">
  <meta property="og:image" content="https://dghostninja.github.io/Skill-Shelf/assets/og-image.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="Skill Shelf">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Skill Shelf · Reusable Agent Skills">
  <meta name="twitter:description" content="A lightweight registry of reusable AI agent skills. Browse, copy, and drop them into any agent's workflow.">
  <meta name="twitter:image" content="https://dghostninja.github.io/Skill-Shelf/assets/og-image.png?v=2">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/og-image.png?v=2">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('ss-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/">
        <span class="brand-logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </span>
        <span class="brand-name">Skill<span>Shelf</span></span>
      </a>
      <div class="header-actions">
        <a class="header-link" href="#/" data-nav-list>Skills</a>
        <a class="header-link" href="#/usage">Usage</a>
        <a class="header-link" href="index.json">index.json</a>
        <a class="header-link" href="https://github.com/" data-repo-link>GitHub</a>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="container" aria-live="polite">
    <div class="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading skill library…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p><span class="footer-brand">Skill<span>Shelf</span></span> · a lightweight registry of reusable agent skills.</p>
      <p>Discover skills in <code>index.json</code> · fetch any skill at <code>skills/&lt;topic&gt;/&lt;skill-name&gt;.md</code></p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="assets/app.js"></script>
</body>
</html>
